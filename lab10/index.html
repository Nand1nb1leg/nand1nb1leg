<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman - Nickname</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background"></div>
    <div class="container">
        <div class="login-box">
            <h1>Дүүжилж Алъя</h1>
            <form id="nickname-form">
                <div class="input-group">
                    <label for="nickname">Өөрийн нэрээ оруулна уу:</label>
                    <input type="text" id="nickname" required placeholder="Жишээ нь:Доржоо">
                </div>
                <button type="submit" class="login-btn">Тоглоом эхлэх</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
