<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SumOfDigits</title>
</head>
<body>

    <script>
        document.writeln("<p>2. Гараас өгсөн тооны цифрүүдийн нийлбэрийг ол</p>")
        var num = window.prompt("Enter a number");
            var total = 0;
            while(num != 0){
                total += num  % 10;
                num = Math.floor(num/10);
            }
            alert("Sum" +total);
    </script>
 </body>
 </html>
